[project]
name = "apimgr"
version = "0.1.0"
description = "HairView AI backend (FastAPI) — 스캐폴드"
requires-python = ">=3.12"
# 버전 범위만 선언한다. 정확한 고정 버전은 설치 후 pip freeze 로 확정한다
# (규칙 §0.9·§4.1: 모델 기억으로 버전 단정 금지).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
